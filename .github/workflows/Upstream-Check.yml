name: Upstream-Check-IPQ60XX

on:
  workflow_dispatch:
  schedule:
    # 每天凌晨 02:00 UTC 检测一次（北京时间 10:00）
    - cron: '0 2 * * *'

env:
  UPSTREAM_REPO: LiBwrt/openwrt-6.x
  UPSTREAM_BRANCH: 25.12-nss
  TRACKED_WORKFLOW: IPQ60XX-NOWIFI-LibWrt.yml
  STATE_FILE: .github/upstream_last_commit.txt
  TZ: Asia/Shanghai

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 用于更新状态文件
      actions: write    # 用于触发其他 workflow
    steps:

      # ============ Step 0: Server酱通用发送函数 ============
      - name: Setup ServerChan Helper
        shell: bash
        run: |
          cat > /tmp/send_serverchan.sh << 'SCSH_EOF'
          send_serverchan() {
            local title="$1"
            local desp="$2"
            local key="${SERVERCHAN_SENDKEY}"
            if [ -z "$key" ]; then
              echo "⚠️ 未配置 SERVERCHAN_SENDKEY，跳过通知"
              return 0
            fi
            if [[ "$key" == sctp* ]]; then
              local uid=$(echo "$key" | sed -n 's/^sctp\([0-9]*\)t.*/\1/p')
              echo "📱 Server酱³ (SC3), uid=${uid}"
              curl -sS -X POST "https://${uid}.push.ft07.com/send/${key}.send" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "title=${title}" \
                --data-urlencode "desp=${desp}" || true
            else
              echo "📱 Server酱Turbo (SCT)"
              curl -sS -X POST "https://sctapi.ftqq.com/${key}.send" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "title=${title}" \
                --data-urlencode "desp=${desp}" || true
            fi
          }
          SCSH_EOF
          chmod +x /tmp/send_serverchan.sh
          echo "✅ Server酱 helper 已就绪"

      # ============ Step 1: 检出本仓库 ============
      - name: Checkout Repo
        uses: actions/checkout@master

      # ============ Step 2: 获取上游最新 commit ============
      - name: Fetch Upstream Latest Commit
        id: upstream
        run: |
          RESP=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}")
          LATEST_SHA=$(echo "$RESP" | grep '"sha"' | head -1 | awk -F'"' '{print $4}')
          LATEST_MSG=$(echo "$RESP" | jq -r '.commit.message' | head -1)
          LATEST_AUTHOR=$(echo "$RESP" | jq -r '.commit.author.name')
          LATEST_DATE=$(echo "$RESP" | jq -r '.commit.author.date')

          if [ -z "$LATEST_SHA" ]; then
            echo "❌ 无法获取上游最新 commit"
            exit 1
          fi

          echo "UPSTREAM_SHA=$LATEST_SHA" >> $GITHUB_OUTPUT
          echo "UPSTREAM_MSG=$LATEST_MSG" >> $GITHUB_OUTPUT
          echo "UPSTREAM_AUTHOR=$LATEST_AUTHOR" >> $GITHUB_OUTPUT
          echo "UPSTREAM_DATE=$LATEST_DATE" >> $GITHUB_OUTPUT

          echo "=========================="
          echo "上游最新: $LATEST_SHA (${LATEST_DATE})"
          echo "提交: $LATEST_MSG"
          echo "=========================="

      # ============ Step 3: 读取本地记录 ============
      - name: Load Last Known Commit
        id: state
        run: |
          if [ -f "$STATE_FILE" ]; then
            LAST_SHA=$(cat "$STATE_FILE" | grep -E '^[0-9a-f]{40}$' | head -1)
          else
            LAST_SHA="INIT"
          fi
          echo "LAST_SHA=${LAST_SHA:-INIT}" >> $GITHUB_OUTPUT

      # ============ Step 4: 判断是否有更新 ============
      - name: Compare and Decide
        id: compare
        run: |
          LATEST="${{ steps.upstream.outputs.UPSTREAM_SHA }}"
          LAST="${{ steps.state.outputs.LAST_SHA }}"

          if [ "$LAST" = "INIT" ]; then
            echo "首次运行 → 初始化状态 + 通知就绪"
            echo "build=1" >> $GITHUB_OUTPUT
            echo "INITIAL_RUN=1" >> $GITHUB_OUTPUT
            echo "UPSTREAM_SHA=$LATEST" >> $GITHUB_OUTPUT
          elif [ "$LAST" = "$LATEST" ]; then
            echo "✅ 无更新，跳过"
            echo "build=0" >> $GITHUB_OUTPUT
          else
            echo "🔔 有新更新！LAST=$LAST → LATEST=$LATEST"
            echo "build=1" >> $GITHUB_OUTPUT
            echo "UPSTREAM_SHA=$LATEST" >> $GITHUB_OUTPUT
            echo "LAST_SHA=$LAST" >> $GITHUB_OUTPUT
          fi

      # ============ Step 5: 深度解析更新内容 ============
      - name: Parse Update Details
        if: steps.compare.outputs.build == '1'
        id: diff
        shell: bash
        run: |
          LATEST="${{ steps.upstream.outputs.UPSTREAM_SHA }}"
          LAST="${{ steps.compare.outputs.LAST_SHA }}"

          if [ "${{ steps.compare.outputs.INITIAL_RUN }}" = "1" ]; then
            # ===== 首次运行：只发初始化通知 =====
            # 顺便探测一下内核版本给用户参考
            KERNEL=$(curl -s "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_BRANCH}/target/linux/generic/kernel-6.12" | grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' || echo "unknown")
            NOTIFY_MSG="## ✅ IPQ60XX 自动编译监控已就绪

**监控上游**: \`${UPSTREAM_REPO}\`
**监控分支**: \`${UPSTREAM_BRANCH}\`
**当前内核**: ${KERNEL}
**当前最新 commit**: \`${LATEST:0:12}\`

---

从现在起每天自动检测，上游有任何更新会：
1. 📬 推送 **变更摘要 + 关键 diff** 到 Server酱
2. 🔄 自动触发 **IPQ60XX-NOWIFI-LibWrt** 编译
3. 📦 编译成功/失败都会推送结果

👉 现在点 Run workflow 手动测一下？"
          else
            # ===== 有新更新：提取完整 diff 并分类解析 =====
            echo "🔍 正在对比 $LAST ... $LATEST"
            DIFF_RESP=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/compare/${LAST}...${LATEST}")

            # ---- 基础统计 ----
            TOTAL_FILES=$(echo "$DIFF_RESP" | jq '.files | length')
            TOTAL_COMMITS=$(echo "$DIFF_RESP" | jq '.commits | length')
            ADDITIONS=$(echo "$DIFF_RESP" | jq '[.files[].additions] | add // 0')
            DELETIONS=$(echo "$DIFF_RESP" | jq '[.files[].deletions] | add // 0')

            # ---- commit 记录（只取首行消息 + 作者 + 时间）----
            COMMITS_BODY=$(echo "$DIFF_RESP" | jq -r '.commits[] | "#### \(.commit.message | split("\n")[0])\n- 👤 \(.commit.author.name)\n- 🕐 \(.commit.author.date | .[0:16])\n- 🔗 [查看](\(.html_url))"')

            # ---- 关键变更：按 IPQ60XX/NSS/QualcommAX 相关分类 ----
            KEY_FILES=$(echo "$DIFF_RESP" | jq -r '.files[].filename' | grep -iE 'ipq60xx|qualcommax|qca|nss|quic|ipq|qsdk|edma|dpdk' || true)
            if [ -n "$KEY_FILES" ]; then
              KEY_SECTION="### 🔑 IPQ60XX/驱动相关变更
\`\`\`
${KEY_FILES}
\`\`\`"
            else
              KEY_SECTION="### 🔑 平台专属变更
> 无 IPQ60XX/NSS 驱动相关文件变更（通用 OpenWrt 更新）"
            fi

            # ---- patch / package 分类 ----
            PATCH_FILES=$(echo "$DIFF_RESP" | jq -r '.files[].filename' | grep -E '\.patch$|patches/' | head -15 || true)
            PKG_FILES=$(echo "$DIFF_RESP" | jq -r '.files[].filename' | grep -E 'package/|feeds/' | head -15 || true)
            NSS_FILES=$(echo "$DIFF_RESP" | jq -r '.files[].filename' | grep -iE 'nss|qca-nss' | head -10 || true)
            TARGET_FILES=$(echo "$DIFF_RESP" | jq -r '.files[].filename' | grep -E 'target/' | head -15 || true)

            # ---- 内核版本是否变化 ----
            OLD_KERNEL=$(curl -s "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${LAST}/target/linux/generic/kernel-6.12" | grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
            NEW_KERNEL=$(curl -s "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${LATEST}/target/linux/generic/kernel-6.12" | grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
            if [ -n "$OLD_KERNEL" ] && [ -n "$NEW_KERNEL" ] && [ "$OLD_KERNEL" != "$NEW_KERNEL" ]; then
              KERNEL_ALERT="⚠️ **内核版本变化**: \`${OLD_KERNEL}\` → \`${NEW_KERNEL}\`"
            else
              KERNEL_ALERT="🐧 当前内核: \`${NEW_KERNEL:-unknown}\`（无变化）"
            fi

            # ---- 拼接完整 Markdown ----
            NOTIFY_MSG="## 🔔 检测到 IPQ60XX 上游更新

**上游**: [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) \`${UPSTREAM_BRANCH}\`
**范围**: \`${LAST:0:12}\` → \`${LATEST:0:12}\`

### 📊 变更统计
- **提交数**: ${TOTAL_COMMITS}
- **文件数**: ${TOTAL_FILES}
- **代码行**: +${ADDITIONS} / -${DELETIONS}

### 🐧 内核状态
${KERNEL_ALERT}

---

${KEY_SECTION}

---

### 📦 其他分类
"
            [ -n "$NSS_FILES" ] && NOTIFY_MSG+="**NSS 驱动**:\n\`\`\`\n${NSS_FILES}\n\`\`\`\n"
            [ -n "$TARGET_FILES" ] && NOTIFY_MSG+="**Target 平台文件**:\n\`\`\`\n${TARGET_FILES}\n\`\`\`\n"
            [ -n "$PKG_FILES" ] && NOTIFY_MSG+="**Package/Feeds**:\n\`\`\`\n${PKG_FILES}\n\`\`\`\n"
            [ -n "$PATCH_FILES" ] && NOTIFY_MSG+="**Patch 补丁**:\n\`\`\`\n${PATCH_FILES}\n\`\`\`\n"

            NOTIFY_MSG+="

---

### 📝 提交记录
${COMMITS_BODY}

---

### 🔗 链接
- [完整 Diff](https://github.com/${UPSTREAM_REPO}/compare/${LAST}...${LATEST})
- [上游仓库](https://github.com/${UPSTREAM_REPO})
- [编译工作流](${{ github.server_url }}/${{ github.repository }}/actions/workflows/${TRACKED_WORKFLOW})"
          fi

          echo "update_details<<DETAILS_EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTIFY_MSG" >> $GITHUB_OUTPUT
          echo "DETAILS_EOF" >> $GITHUB_OUTPUT
          echo "✅ 解析完成"

      # ============ Step 6: Server酱推送 ============
      - name: Notify via ServerChan
        if: steps.compare.outputs.build == '1'
        shell: bash
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          source /tmp/send_serverchan.sh
          if [ "${{ steps.compare.outputs.INITIAL_RUN }}" = "1" ]; then
            TITLE="✅ IPQ60XX 自动编译监控已就绪"
          else
            TITLE="🔔 IPQ60XX 上游更新 + 自动编译"
          fi
          send_serverchan "$TITLE" "${{ steps.diff.outputs.update_details }}"

      # ============ Step 7: 触发编译工作流 ============
      - name: Trigger Build Workflow
        if: steps.compare.outputs.build == '1' && steps.compare.outputs.INITIAL_RUN != '1'
        run: |
          TRIGGER_SHA="${{ steps.compare.outputs.UPSTREAM_SHA }}"
          if [ -n "${{ secrets.DISPATCH_TOKEN }}" ]; then
            TOKEN="${{ secrets.DISPATCH_TOKEN }}"
            TOKEN_LABEL="DISPATCH_TOKEN (推荐)"
          else
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
            TOKEN_LABEL="GITHUB_TOKEN (默认，可能无跨 workflow 权限)"
          fi
          echo "使用 $TOKEN_LABEL 触发 ${TRACKED_WORKFLOW}..."

          RESULT=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${TRACKED_WORKFLOW}/dispatches" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"master\",\"inputs\":{\"upstream_sha\":\"${TRIGGER_SHA}\",\"auto_trigger\":\"true\"}}")

          echo "返回 HTTP $RESULT"
          if [ "$RESULT" = "204" ] || [ "$RESULT" = "202" ]; then
            echo "✅ 编译已触发"
          elif [ "$RESULT" = "404" ] || [ "$RESULT" = "403" ] || [ "$RESULT" = "422" ]; then
            echo "❌ 触发失败。需要创建 PAT → DISPATCH_TOKEN"
            echo "👉 https://github.com/settings/tokens 生成 classic token, 勾 repo 权限"
          else
            echo "❌ 其他错误"
          fi

      # ============ Step 8: 更新状态文件 ============
      - name: Update State File
        if: steps.compare.outputs.build == '1'
        run: |
          echo "${{ steps.compare.outputs.UPSTREAM_SHA }}" > "$STATE_FILE"
          echo "LAST_CHECK=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$STATE_FILE"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$STATE_FILE"
          git commit -m "chore: update upstream tracking state" || true
          git push origin master || true
          echo "✅ 状态已更新"
