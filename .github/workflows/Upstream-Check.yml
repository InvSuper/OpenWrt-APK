name: Upstream-Check-IPQ60XX

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Debug 1 - echo
        run: echo "hello world"

      - name: Debug 2 - curl test
        run: curl -s "https://api.github.com/repos/LiBwrt/openwrt-6.x/commits/25.12-nss" -o /tmp/api_resp.json && echo "curl OK, size=$(wc -c < /tmp/api_resp.json)"

      - name: Debug 3 - jq parse
        run: |
          SHA=$(jq -r '.sha' /tmp/api_resp.json)
          echo "Latest SHA: $SHA"
