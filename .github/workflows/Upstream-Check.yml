name: Upstream-Check-IPQ60XX

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Ignore state file, force build'
        required: false
        default: 'false'
  schedule:
    - cron: '0 2 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Fetch Upstream Commit
        id: upstream
        run: |
          curl -s "https://api.github.com/repos/LiBwrt/openwrt-6.x/commits/25.12-nss" -o /tmp/upstream.json
          LATEST=$(jq -r '.sha' /tmp/upstream.json)
          LATEST_MSG=$(jq -r '.commit.message.split("\n")[0]' /tmp/upstream.json)
          LATEST_DATE=$(jq -r '.commit.author.date' /tmp/upstream.json)
          echo "SHA=$LATEST"
          echo "LATEST_SHA=$LATEST" >> $GITHUB_OUTPUT
          echo "LATEST_MSG=$LATEST_MSG" >> $GITHUB_OUTPUT
          echo "LATEST_DATE=$LATEST_DATE" >> $GITHUB_OUTPUT

      - name: Load State File
        id: state
        run: |
          if [ -f ".github/upstream_last_commit.txt" ]; then
            LAST=$(cat .github/upstream_last_commit.txt | head -1 | tr -d '[:space:]')
          else
            LAST="INIT"
          fi
          echo "Last known: $LAST"
          echo "LAST_SHA=$LAST" >> $GITHUB_OUTPUT

      - name: Compare and Decide
        id: compare
        run: |
          LATEST="${{ steps.upstream.outputs.LATEST_SHA }}"
          LAST="${{ steps.state.outputs.LAST_SHA }}"
          FORCE="${{ inputs.force_build }}"
          if [ "$FORCE" = "true" ]; then
            echo "BUILD=1" >> $GITHUB_OUTPUT
            echo "LAST_SHA=$LAST" >> $GITHUB_OUTPUT
            echo "UPSTREAM_SHA=$LATEST" >> $GITHUB_OUTPUT
          elif [ "$LAST" = "INIT" ]; then
            echo "BUILD=1" >> $GITHUB_OUTPUT
            echo "INITIAL_RUN=1" >> $GITHUB_OUTPUT
            echo "UPSTREAM_SHA=$LATEST" >> $GITHUB_OUTPUT
          elif [ "$LAST" = "$LATEST" ]; then
            echo "BUILD=0" >> $GITHUB_OUTPUT
          else
            echo "BUILD=1" >> $GITHUB_OUTPUT
            echo "LAST_SHA=$LAST" >> $GITHUB_OUTPUT
            echo "UPSTREAM_SHA=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Parse Update Diff
        if: steps.compare.outputs.BUILD == '1'
        id: diff
        run: |
          LATEST="${{ steps.upstream.outputs.LATEST_SHA }}"
          LAST="${{ steps.compare.outputs.LAST_SHA }}"
          INITIAL="${{ steps.compare.outputs.INITIAL_RUN }}"
          if [ "$INITIAL" != "1" ] && [ -n "$LAST" ]; then
            curl -s "https://api.github.com/repos/LiBwrt/openwrt-6.x/compare/${LAST}...${LATEST}" -o /tmp/compare.json
            TOTAL_FILES=$(jq '.files | length' /tmp/compare.json)
            TOTAL_COMMITS=$(jq '.commits | length' /tmp/compare.json)
            echo "TOTAL_FILES=$TOTAL_FILES" >> $GITHUB_OUTPUT
            echo "TOTAL_COMMITS=$TOTAL_COMMITS" >> $GITHUB_OUTPUT
            echo "--- commits ---"
            jq -r '.commits[] | "[" + .sha[0:10] + "] " + .commit.message.split("\n")[0]' /tmp/compare.json | head -10
          fi

      - name: Build Notification Message
        if: steps.compare.outputs.BUILD == '1'
        run: |
          LATEST="${{ steps.upstream.outputs.LATEST_SHA }}"
          LAST="${{ steps.compare.outputs.LAST_SHA }}"
          INITIAL="${{ steps.compare.outputs.INITIAL_RUN }}"
          if [ "$INITIAL" = "1" ]; then
            printf '✅ IPQ60XX 自动编译监控已就绪' > /tmp/title.txt
            printf '**上游**: LiBwrt/openwrt-6.x (25.12-nss)\n' > /tmp/desp.txt
            printf '**最新**: %s\n\n' "${LATEST:0:12}" >> /tmp/desp.txt
            printf '每天北京时间 10:00 自动检测，有更新会：\n' >> /tmp/desp.txt
            printf '1. 推送变更摘要\n' >> /tmp/desp.txt
            printf '2. 触发 IPQ60XX-NOWIFI-LibWrt 编译\n' >> /tmp/desp.txt
            printf '3. 编译结果推送\n' >> /tmp/desp.txt
          else
            printf '🔔 IPQ60XX 上游更新' > /tmp/title.txt
            {
              printf '## IPQ60XX 上游更新\n\n'
              printf '**范围**: %s -> %s\n' "${LAST:0:12}" "${LATEST:0:12}"
              printf '\n### 提交记录\n'
              jq -r '.commits[] | "- [" + .sha[0:10] + "] " + .commit.message.split("\n")[0] + " (" + .commit.author.name + ")"' /tmp/compare.json | head -10
              printf '\n### 相关文件\n'
              jq -r '.files[].filename' /tmp/compare.json | grep -iE 'ipq60xx|qualcommax|qca|nss|quic|edma|qsdk' | head -10 || echo '(无专属驱动变更)'
              printf '\n### 链接\n'
              printf '完整 Diff: https://github.com/LiBwrt/openwrt-6.x/compare/%s...%s\n' "$LAST" "$LATEST"
            } > /tmp/desp.txt
          fi
          echo "Title:"; cat /tmp/title.txt
          echo "---"
          echo "Desp:"; cat /tmp/desp.txt

      - name: Send ServerChan
        if: steps.compare.outputs.BUILD == '1'
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          if [ -z "$SERVERCHAN_SENDKEY" ]; then
            echo "SERVERCHAN_SENDKEY not configured"
            exit 0
          fi
          TITLE=$(cat /tmp/title.txt)
          DESP=$(cat /tmp/desp.txt)
          if [[ "$SERVERCHAN_SENDKEY" == sctp* ]]; then
            UID=$(echo "$SERVERCHAN_SENDKEY" | sed -n 's/^sctp\([0-9]*\)t.*/\1/p')
            echo "Server酱³ uid=$UID"
            curl -sS -X POST "https://${UID}.push.ft07.com/send/${SERVERCHAN_SENDKEY}.send" --data-urlencode "title=$TITLE" --data-urlencode "desp=$DESP" || true
          else
            echo "Server酱Turbo"
            curl -sS -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" --data-urlencode "title=$TITLE" --data-urlencode "desp=$DESP" || true
          fi
          echo "ServerChan done"

      - name: Trigger Build Workflow
        if: steps.compare.outputs.BUILD == '1' && steps.compare.outputs.INITIAL_RUN != '1'
        continue-on-error: true
        run: |
          TRIGGER_SHA="${{ steps.compare.outputs.UPSTREAM_SHA }}"
          TOKEN="${{ secrets.DISPATCH_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          RESULT=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/IPQ60XX-NOWIFI-LibWrt.yml/dispatches" \
            -d "{\"ref\":\"master\",\"inputs\":{\"upstream_sha\":\"${TRIGGER_SHA}\",\"auto_trigger\":\"true\"}}")
          echo "Trigger result: HTTP $RESULT"

      - name: Update State File
        if: steps.compare.outputs.BUILD == '1'
        run: |
          echo "${{ steps.compare.outputs.UPSTREAM_SHA }}" > .github/upstream_last_commit.txt
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .github/upstream_last_commit.txt
          git commit -m "chore: update upstream tracking state" || true
          git push origin master || true
          echo "State file updated"
